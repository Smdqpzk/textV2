<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字學習卡</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #333; }
        .sync-status {
            font-size: 12px;
            text-align: right;
            color: #888;
            margin-bottom: 10px;
        }
        .card-box {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fafafa;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card-box:hover {
            border-color: #4a90e2;
        }
        .word { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .meaning { font-size: 18px; color: #7f8c8d; display: none; }
        .card-box.show .meaning { display: block; }
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #357abd; }
        .input-group {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        input {
            width: calc(50% - 12px);
            padding: 8px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .add-btn { background-color: #27ae60; margin-top: 10px; width: 100%; }
        .add-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>自動同步單字學習卡</h2>
    <div id="syncStatus" class="sync-status">狀態：已與本地儲存同步</div>

    <!-- 單字卡顯示區 -->
    <div class="card-box" id="cardBox" onclick="toggleMeaning()">
        <div id="wordDisplay" class="word">載入中...</div>
        <div id="meaningDisplay" class="meaning">點擊下方按鈕或卡片看解釋</div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">上一個</button>
        <button onclick="toggleMeaning()">翻轉 / 看解釋</button>
        <button onclick="nextCard()">下一個</button>
    </div>

    <!-- 新增單字區（會自動即時同步） -->
    <div class="input-group">
        <h4>新增單字</h4>
        <input type="text" id="newWord" placeholder="英文單字">
        <input type="text" id="newMeaning" placeholder="中文解釋">
        <button class="add-btn" onclick="addNewWord()">新增並自動同步</button>
    </div>
</div>

<script>
    // 預設單字庫或從 LocalStorage 讀取
    let vocabList = JSON.parse(localStorage.getItem('vocabList')) || [
        { word: "synchronize", meaning: "同步" },
        { word: "automatic", meaning: "自動的" },
        { word: "application", meaning: "應用程式" }
    ];

    let currentIndex = 0;

    function updateDisplay() {
        if (vocabList.length === 0) {
            document.getElementById('wordDisplay').innerText = "目前無單字";
            document.getElementById('meaningDisplay').innerText = "請下方新增";
            return;
        }
        if (currentIndex >= vocabList.length) currentIndex = 0;
        
        document.getElementById('wordDisplay').innerText = vocabList[currentIndex].word;
        document.getElementById('meaningDisplay').innerText = vocabList[currentIndex].meaning;
        document.getElementById('cardBox').classList.remove('show');
    }

    function toggleMeaning() {
        document.getElementById('cardBox').classList.toggle('show');
    }

    function nextCard() {
        if (vocabList.length === 0) return;
        currentIndex = (currentIndex + 1) % vocabList.length;
        updateDisplay();
    }

    function prevCard() {
        if (vocabList.length === 0) return;
        currentIndex = (currentIndex - 1 + vocabList.length) % vocabList.length;
        updateDisplay();
    }

    // 儲存並觸發自動同步
    function saveAndSync() {
        localStorage.setItem('vocabList', JSON.stringify(vocabList));
        
        // 更新畫面提示
        const statusEl = document.getElementById('syncStatus');
        const now = new Date().toLocaleTimeString();
        statusEl.innerText = `狀態：已自動同步 (${now})`;

        // 可以在這裡擴充雲端 API 同步函式（例如同步至 GitHub 或是後端伺服器）
        // syncToCloud(vocabList);
    }

    function addNewWord() {
        const w = document.getElementById('newWord').value.trim();
        const m = document.getElementById('newMeaning').value.trim();

        if (!w || !m) {
            alert("請完整輸入英文與中文！");
            return;
        }

        vocabList.push({ word: w, meaning: m });
        saveAndSync(); // 儲存並同步

        document.getElementById('newWord').value = '';
        document.getElementById('newMeaning').value = '';
        updateDisplay();
    }

    // 核心：監聽其他分頁的 Storage 變動，達成「自動即時同步」
    window.addEventListener('storage', function(e) {
        if (e.key === 'vocabList') {
            vocabList = JSON.parse(e.newValue) || [];
            updateDisplay();
            document.getElementById('syncStatus').innerText = `狀態：已從其他分頁自動同步 (${new Date().toLocaleTimeString()})`;
        }
    });

    // 初始化載入
    updateDisplay();
</script>

</body>
</html>
