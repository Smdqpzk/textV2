<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>學測單字記憶卡 - 自動同步版</title>

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --gray-color: #64748b;
            --border-color: #e2e8f0;
            --card-back-bg: #e0e7ff;
            --card-back-color: #312e81;
            --item-hover-bg: #f1f5f9;
            --current-item-bg: #eef2ff;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05),
                       0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --gray-color: #94a3b8;
            --border-color: #334155;
            --card-back-bg: #312e81;
            --card-back-color: #e0e7ff;
            --item-hover-bg: #334155;
            --current-item-bg: #312e81;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3),
                       0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 0 0 24px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* 頂端功能列 */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-sync {
            background-color: #0d9488;
        }

        .btn-theme {
            background-color: #7c3aed;
        }

        .sync-status {
            font-size: 12px;
            color: var(--gray-color);
            margin-bottom: 12px;
            text-align: right;
            font-weight: 500;
            min-height: 18px;
        }

        /* 篩選與搜尋 */
        .filter-search-container {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: background-color 0.3s;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-row label {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            color: var(--gray-color);
            width: 75px;
        }

        .filter-row select,
        .filter-row input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-row select:focus,
        .filter-row input:focus {
            border-color: var(--primary-color);
        }

        /* 狀態按鈕 */
        .status-buttons-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .filter-tab-btn {
            flex: 1;
            padding: 8px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .filter-tab-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);
        }

        /* 新增單字 */
        .add-card-form {
            background: var(--card-bg);
            padding: 20px 22px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background-color 0.3s;
        }

        .add-card-form h3 {
            margin: 0 0 4px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .add-card-form input,
        .add-card-form select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-card-form input:focus,
        .add-card-form select:focus {
            border-color: var(--primary-color);
        }

        .add-card-form button {
            padding: 11px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-card-form button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* 統計 */
        .stats-section {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            transition: background-color 0.3s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-color);
            flex-wrap: wrap;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            width: 0%;
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 單字卡 */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: var(--card-back-bg);
            color: var(--card-back-color);
            border-color: transparent;
        }

        .word {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .badge-container {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-pos {
            background-color: #0d9488;
        }

        .meaning {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .example {
            font-size: 15px;
            color: inherit;
            opacity: 0.9;
            font-style: italic;
            max-width: 90%;
            line-height: 1.6;
        }

        .hint {
            font-size: 12px;
            color: var(--gray-color);
            margin-top: 20px;
            font-weight: 500;
        }

        /* 控制按鈕 */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .controls button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .controls button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .controls button:active {
            transform: scale(0.97);
        }

        .btn-prev,
        .btn-next {
            background-color: #64748b;
        }

        .btn-known {
            background-color: #10b981;
        }

        .btn-unknown {
            background-color: #ef4444;
        }

        /* 單字列表 */
        .word-list {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        .word-list h3 {
            margin-top: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            border-radius: 8px;
            transition: background 0.15s;
            gap: 8px;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-btn {
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            color: var(--text-color);
            flex: 1;
            min-width: 0;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s;
            font-weight: 500;
            line-height: 1.5;
        }

        .word-btn:hover {
            background-color: var(--item-hover-bg);
            color: var(--primary-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 分頁 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .page-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .page-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);
        }

        .page-ellipsis {
            padding: 6px 4px;
            color: var(--gray-color);
            font-size: 13px;
            font-weight: 600;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 360px;
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin-top: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--gray-color);
            margin-bottom: 20px;
            word-break: break-word;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .modal-actions button:hover {
            opacity: 0.9;
        }

        .btn-modal-cancel {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-modal-confirm {
            background-color: #ef4444;
            color: white;
        }

        /* 手機版 */
        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 24px;
            }

            .filter-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            .filter-row label {
                width: auto;
            }

            .filter-row select,
            .filter-row input {
                width: 100%;
            }

            .status-buttons-group {
                width: 100%;
            }

            .flashcard-container {
                height: 240px;
            }

            .word {
                font-size: 30px;
            }

            .meaning {
                font-size: 23px;
            }

            .controls {
                gap: 6px;
            }

            .controls button {
                padding: 11px 6px;
                font-size: 13px;
            }

            .stats-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body data-theme="light">

    <div class="container">

        <h1>學測單字記憶卡</h1>

        <!-- 同步狀態 -->
        <div id="syncStatus" class="sync-status">
            狀態：正在初始化...
        </div>

        <!-- 功能列 -->
        <div class="top-action-bar">

            <span style="font-size: 13px; font-weight: 600; color: var(--gray-color);">
                ⚙️ 資料管理
            </span>

            <div class="btn-group">

                <button
                    class="btn-action btn-theme"
                    onclick="toggleTheme()"
                    id="themeToggleBtn">
                    🌙 深色模式
                </button>

                <button
                    class="btn-action btn-sync"
                    onclick="exportData()">
                    匯出
                </button>

                <button
                    class="btn-action btn-sync"
                    onclick="document.getElementById('importFile').click()">
                    匯入
                </button>

                <input
                    type="file"
                    id="importFile"
                    style="display: none;"
                    accept=".json"
                    onchange="importData(event)">

                <button
                    class="btn-action"
                    onclick="loadDefaultWords()">
                    單字重置
                </button>

            </div>
        </div>

        <!-- 篩選 -->
        <div class="filter-search-container">

            <div class="filter-row">

                <label>背誦狀態</label>

                <div class="status-buttons-group">

                    <button
                        class="filter-tab-btn active"
                        id="statusBtn-all"
                        onclick="setStatusFilter('all')">
                        全部
                    </button>

                    <button
                        class="filter-tab-btn"
                        id="statusBtn-known"
                        onclick="setStatusFilter('known')">
                        🟢 已背熟
                    </button>

                    <button
                        class="filter-tab-btn"
                        id="statusBtn-unknown"
                        onclick="setStatusFilter('unknown')">
                        🔴 未背熟
                    </button>

                </div>
            </div>

            <div class="filter-row">

                <label for="categoryFilter">
                    詞性篩選
                </label>

                <select
                    id="categoryFilter"
                    onchange="filterWords()">

                    <option value="all">
                        全部詞性 (All)
                    </option>

                    <option value="動詞">
                        動詞 (Verb)
                    </option>

                    <option value="名詞">
                        名詞 (Noun)
                    </option>

                    <option value="形容詞">
                        形容詞 (Adjective)
                    </option>

                    <option value="副詞">
                        副詞 (Adverb)
                    </option>

                    <option value="片語">
                        片語 (Phrase)
                    </option>

                    <option value="轉折詞">
                        轉折詞 (Transition)
                    </option>

                </select>
            </div>

            <div class="filter-row">

                <label for="searchInput">
                    單字搜尋
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="輸入關鍵字搜尋單字或中文..."
                    oninput="filterWords()">

            </div>

        </div>

        <!-- 新增單字 -->
        <div class="add-card-form">

            <h3>➕ 新增自訂單字</h3>

            <input
                type="text"
                id="inputWord"
                placeholder="請輸入單字 (例: environment)">

            <input
                type="text"
                id="inputMeaning"
                placeholder="請輸入中文意思 (例: 環境)">

            <input
                type="text"
                id="inputExample"
                placeholder="請輸入例句 (選填)">

            <select id="inputCategory">

                <option value="動詞">
                    動詞 (Verb)
                </option>

                <option value="名詞">
                    名詞 (Noun)
                </option>

                <option value="形容詞">
                    形容詞 (Adjective)
                </option>

                <option value="副詞">
                    副詞 (Adverb)
                </option>

                <option value="片語">
                    片語 (Phrase)
                </option>

                <option value="轉折詞">
                    轉折詞 (Transition)
                </option>

            </select>

            <button onclick="addWord()">
                新增到字庫
            </button>

        </div>

        <!-- 統計 -->
        <div class="stats-section">

            <div class="stats-bar">

                <span id="cardCount">
                    進度: 0 / 0
                </span>

                <span id="overallProgressText">
                    整體背誦率: 0% (0/0)
                </span>

                <span id="masteryStatus">
                    狀態: 未背熟
                </span>

            </div>

            <div class="progress-bar-container">

                <div
                    class="progress-bar-fill"
                    id="progressBarFill">
                </div>

            </div>

        </div>

        <!-- 單字卡 -->
        <div
            class="flashcard-container"
            onclick="flipCard()">

            <div
                class="flashcard"
                id="flashcard">

                <!-- 正面 -->
                <div class="card-face card-front">

                    <div class="badge-container">

                        <span
                            class="badge badge-pos"
                            id="displayCategory">
                            動詞
                        </span>

                    </div>

                    <div
                        class="word"
                        id="displayWord">
                        載入中...
                    </div>

                    <div class="hint">
                        💡 點擊卡片翻面看中文與例句
                    </div>

                </div>

                <!-- 背面 -->
                <div class="card-face card-back">

                    <div
                        class="meaning"
                        id="displayMeaning">
                        請稍候
                    </div>

                    <div
                        class="example"
                        id="displayExample">
                    </div>

                </div>

            </div>

        </div>

        <!-- 控制 -->
        <div class="controls">

            <button
                class="btn-prev"
                onclick="prevCard()">
                上一張
            </button>

            <button
                class="btn-unknown"
                onclick="markStatus(false)">
                ❌ 未熟
            </button>

            <button
                class="btn-known"
                onclick="markStatus(true)">
                ✔️ 記住了
            </button>

            <button
                class="btn-next"
                onclick="nextCard()">
                下一張
            </button>

        </div>

        <!-- 單字列表 -->
        <div class="word-list">

            <h3>
                單字清單表（A-Z 排序）
            </h3>

            <div id="wordListContainer"></div>

            <div
                class="pagination"
                id="paginationContainer">
            </div>

        </div>

    </div>

    <!-- 刪除 Modal -->
    <div
        class="modal-overlay"
        id="deleteModal">

        <div class="modal-box">

            <h3>
                確認刪除
            </h3>

            <p id="deleteModalText">

            try {
                const saved =
                    localStorage.getItem(KNOWN_STORAGE_KEY);

                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
                        return parsed;
                    }
                }

                // 從舊版本 LocalStorage 遷移「known」資料一次；
                // 遷移後不再保存完整單字資料。
                const legacy =
                    localStorage.getItem(LEGACY_STORAGE_KEY);

                if (legacy) {
                    const parsedLegacy = JSON.parse(legacy);
                    if (Array.isArray(parsedLegacy)) {
                        const migrated = {};
                        parsedLegacy.forEach(item => {
                            if (item && item.word) {
                                const key = `${item.word}\u0000${item.category || "其他"}`;
                                migrated[key] = item.known === true;
                            }
                        });

                        localStorage.setItem(
                            KNOWN_STORAGE_KEY,
                            JSON.stringify(migrated)
                        );

                        return migrated;
                    }
                }

            } catch (error) {
                console.error(

        // =========================================================
        // 取得篩選後單字
        // =========================================================

        function getFilteredWords() {

            let filtered = [...words];


            // 背誦狀態
            if (currentStatusFilter === "known") {

                filtered =
                    filtered.filter(
                        item => item.known === true
                    );

            } else if (
                currentStatusFilter === "unknown"
            ) {

                filtered =
                    filtered.filter(
                        item => item.known !== true
                    );

            }


            // 詞性
            const categoryValue =
                categoryFilter.value;

            if (categoryValue !== "all") {

                filtered =
                    filtered.filter(
                        item =>
                            item.category === categoryValue
                    );

            }


            // 搜尋
            const keyword =
                searchInput.value
                    .trim()
                    .toLowerCase();

            if (keyword !== "") {

                filtered =
                    filtered.filter(item => {

                        const word =
                            String(item.word || "")
                                .toLowerCase();

                        const meaning =
                            String(item.meaning || "")
                                .toLowerCase();

                        const example =
                            String(item.example || "")
                                .toLowerCase();

                        return (
                            word.includes(keyword) ||
                            meaning.includes(keyword) ||
                            example.includes(keyword)
                        );

                    });

            }


            // A-Z
            filtered.sort((a, b) =>
                String(a.word || "").localeCompare(
                    String(b.word || ""),
                    "en",
                    {
                        sensitivity: "base"
                    }
                )
            );


            return filtered;
        }


        // =========================================================
        // 篩選
        // =========================================================

        function filterWords() {

            currentIndex = 0;

            currentListPage = 1;

            isFlipped = false;

                "flipped"
            );

            updateCard();
        }


        // =========================================================
        // 整體進度
        // =========================================================

        function updateOverallProgress() {

            const categoryValue =
                categoryFilter.value;

            let targetGroup = words;

            let labelPrefix = "整體";


            if (categoryValue !== "all") {

                targetGroup =
                    words.filter(
                        word =>
                            word.category === categoryValue
                    );

                labelPrefix = categoryValue;
            }


            const total =
                targetGroup.length;

            const knownCount =
                targetGroup.filter(
                    word => word.known === true
                ).length;

            const unknownCount =
                total - knownCount;

            let percentage = 0;


            if (currentStatusFilter === "known") {

                percentage =
                    total > 0
                        ? Math.round(
                            (knownCount / total) * 100
                        )
                        : 0;

                overallProgressText.textContent =
                    `${labelPrefix}已背熟率: ${percentage}% (${knownCount}/${total})`;

            } else if (
                currentStatusFilter === "unknown"
            ) {

                percentage =
                    total > 0
                        ? Math.round(
                            (unknownCount / total) * 100
                        )
                        : 0;

                overallProgressText.textContent =
                    `${labelPrefix}未背熟率: ${percentage}% (${unknownCount}/${total})`;

            } else {

                percentage =
                    total > 0
                        ? Math.round(
                            (knownCount / total) * 100
                        )
                        : 0;

                overallProgressText.textContent =
                    `${labelPrefix}背誦率: ${percentage}% (${knownCount}/${total})`;
            }


            progressBarFill.style.width =
                `${percentage}%`;
        }


        // =========================================================
        // 更新卡片
        // =========================================================

        function updateCard() {

            const filteredWords =
                getFilteredWords();


            updateOverallProgress();


            // 沒有符合條件的單字
            if (filteredWords.length === 0) {

                displayWord.textContent =
                    "查無符合單字";

                displayMeaning.textContent =
                    "請調整篩選或搜尋條件";

                displayExample.textContent =

                displayCategory.textContent =

                isFlipped = false;

                flashcard.classList.remove(
                    "flipped"
                );

                renderWordList();

                

                return;
            }


            // 保持 Index 合法
            if (
                currentIndex >=
                filteredWords.length
            ) {
                currentIndex = 0;
            }

            if (currentIndex < 0) {
                currentIndex =
                    filteredWords.length - 1;
            }


            // 自動調整目前頁碼
            const targetPage =
                Math.floor(
                    currentIndex / itemsPerPage
                ) + 1;

            currentListPage =
                targetPage;


            const current =
                filteredWords[currentIndex];


            // 顯示卡片
            displayWord.textContent =
                current.word || "";

            displayMeaning.textContent =
                current.meaning || "";

            displayExample.textContent =
                current.example || "";

            displayCategory.textContent =
                current.category || "未分類";


            // 進度
            cardCount.textContent =
                `進度: ${currentIndex + 1} / ${filteredWords.length}`;


            // 狀態
            masteryStatus.textContent =
                current.known === true
                    ? "狀態: 🟢 已記住"
                    : "狀態: 🔴 未背熟";

            if (isFlipped) {

                flashcard.classList.remove(
                    "flipped"
                );

                isFlipped = false;
            }


            renderWordList();

            // 本機儲存
            
        }

        function nextCard() {

            const filteredWords =
                getFilteredWords();

            if (filteredWords.length === 0) {
                return;
            }

            currentIndex =
                (currentIndex + 1) %
                filteredWords.length;

            updateCard();

        // 上一張

        function prevCard() {

            const filteredWords =
                getFilteredWords();

            if (filteredWords.length === 0) {
                return;

            currentIndex =

                    1 +
                    filteredWords.length

            const filteredWords =
                getFilteredWords();

            if (filteredWords.length === 0) {
                return;

            const targetWord =
                filteredWords[currentIndex];


            const originalIndex =
                words.findIndex(
                    item =>
                        item.word === targetWord.word &&
                        item.category === targetWord.category
                );


            if (originalIndex !== -1) {

                words[originalIndex].known =
                    status;

                saveKnownStatus(words[originalIndex], status);
            }


            updateCard();


            // 按「記住了」後自動下一張
            if (
                status === true &&
                currentIndex <
                filteredWords.length - 1
            ) {

                nextCard();
            }
        }


        // =========================================================
        // 新增單字
        // =========================================================

        function addWord() {

            const wordInput =
                document.getElementById(
                    "inputWord"
                );

            const meaningInput =
                document.getElementById(
                    "inputMeaning"
                );

            const exampleInput =
                document.getElementById(
                    "inputExample"
                );

            const categoryInput =
                document.getElementById(
                    "inputCategory"
                );


            const newWordValue =
                wordInput.value.trim();

            const newMeaningValue =
                meaningInput.value.trim();

            const newExampleValue =
                exampleInput.value.trim();

            const newCategoryValue =
                categoryInput.value;


            if (
                !newWordValue ||
                !newMeaningValue
            ) {

                alert(
                    "請至少填寫「單字」與「中文意思」！"
                );

                return;
            }


            // 檢查重複
            const isDuplicate =
                words.some(
                    item =>
                        String(item.word)
                            .toLowerCase() ===
                        newWordValue.toLowerCase() &&
                        item.category ===
                        newCategoryValue
                );


            if (isDuplicate) {

                alert(
                    `字庫中已經存在相同詞性（${newCategoryValue}）的「${newWordValue}」了！`
                );

                return;
            }


            // 新增
            const newWord = {
                word: newWordValue,
                meaning: newMeaningValue,
                example: newExampleValue,
                category: newCategoryValue,
                known: false
            };

            words.push(newWord);
            saveKnownStatus(newWord, false);


            // 清空表單
            wordInput.value = "";

            meaningInput.value = "";

            exampleInput.value = "";


            // 自動切到新增的詞性
            categoryFilter.value =
                newCategoryValue;

            currentStatusFilter =
                "all";

            document
                .querySelectorAll(".filter-tab-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            document
                .getElementById("statusBtn-all")
                .classList.add("active");

            searchInput.value = "";


            // 找到新單字位置
            const filteredWords =
                getFilteredWords();

            const newIndex =
                filteredWords.findIndex(
                    item =>
                        item.word === newWordValue &&
                        item.category === newCategoryValue
                );


            if (newIndex !== -1) {

                currentIndex =
                    newIndex;

                currentListPage =
                    Math.floor(
                        newIndex /
                        itemsPerPage
                    ) + 1;
            }


            updateCard();

            scheduleCloudSave();


            syncStatus.textContent =
                "狀態：🟡 已新增單字，正在同步...";
        }

                    event.target ===

                    closeDeleteModal();

            }

        // =========================================================
        // 確認刪除
        // =========================================================

        confirmDeleteBtn.onclick =
            function () {

                if (!pendingDeleteTarget) {
                    return;
                }


                const {
                    word: wordText,
                    category: categoryText
                } =
                    pendingDeleteTarget;


                const originalIndex =
                    words.findIndex(
                        item =>
                            item.word === wordText &&
                            item.category === categoryText
                    );


                if (originalIndex !== -1) {

                    removeKnownStatus(words[originalIndex]);

                    words.splice(
                        originalIndex,
                        1
                    );
                }


                closeDeleteModal();


                const filteredWords =
                    getFilteredWords();


                if (
                    currentIndex >=
                    filteredWords.length
                ) {

                    currentIndex =
                        Math.max(
                            0,
                            filteredWords.length - 1
                        );
                }


                const maxPage =
                    Math.max(
                        1,
                        Math.ceil(
                            filteredWords.length /
                            itemsPerPage
                        )
                    );


                if (
                    currentListPage >
                    maxPage
                ) {

                    currentListPage =
                        maxPage;
                }


                updateCard();

                scheduleCloudSave();


                syncStatus.textContent =
                    "狀態：🟡 已刪除，正在同步...";
            };

        // =========================================================
        // 匯出
        // =========================================================

        function exportData() {

            const json =
                JSON.stringify(
                    words,
                    null,
                    2
                );


            const blob =
                new Blob(
                    [json],
                    {
                        type:
                            "application/json;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const anchor =
                document.createElement("a");


            anchor.href = url;

            anchor.download =
                "vocab_backup.json";


            document.body.appendChild(
                anchor
            );

            anchor.click();

            anchor.remove();


            URL.revokeObjectURL(url);


            syncStatus.textContent =
                "狀態：🟢 已匯出資料";
        }


        // =========================================================
        // 匯入
        // =========================================================

        function importData(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function (e) {

                    try {

                        const importedWords =
                            JSON.parse(
                                e.target.result
                            );


                        if (
                            !Array.isArray(
                                importedWords
                            )
                        ) {

                            alert(
                                "檔案格式錯誤！"
                            );

                            return;
                        }


                        // 基本資料清理
                        // 匯入的是「雲端單字本體」；known 另外保存到 LocalStorage。
                        knownStatuses = {};

                        words =
                            importedWords
                                .filter(
                                    item =>
                                        item &&
                                        typeof item ===
                                            "object" &&
                                        item.word &&
                                        item.meaning
                                )
                                .map(
                                    item => ({
                                        word:
                                            String(
                                                item.word
                                            ),

                                        meaning:
                                            String(
                                                item.meaning
                                            ),

                                        example:
                                            String(
                                                item.example ||
                                                ""
                                            ),

                                        category:
                                            String(
                                                item.category ||
                                                "名詞"
                                            ),

                                        known:
                                            item.known ===
                                            true
                                    })
                                );

                        words.forEach(word => {
                            knownStatuses[getWordStatusKey(word)] = word.known === true;
                        });
                        saveKnownStatuses();


                        currentIndex = 0;

                        currentListPage = 1;

                        currentStatusFilter =
                            "all";

                        categoryFilter.value =
                            "all";

                        searchInput.value =
                            "";


                        document
                            .querySelectorAll(
                                ".filter-tab-btn"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );

                        document
                            .getElementById(
                                "statusBtn-all"
                            )
                            .classList.add(
                                "active"
                            );


                        updateCard();

                        scheduleCloudSave();


                        alert(
                            "資料匯入成功！"
                        );


                        syncStatus.textContent =
                            "狀態：🟡 匯入完成，正在同步...";
                    }

                    catch (error) {

                        console.error(
                            "匯入錯誤：",
                            error
                        );

                        alert(
                            "解析檔案失敗！請確認 JSON 格式正確。"
                        );
                    }

                };


            reader.readAsText(
                file,
                "UTF-8"
            );


            // 讓同一個檔案可以再次選取
            event.target.value = "";
        }


        // =========================================================
        // Render 單字列表
        // =========================================================

        function renderWordList() {

            wordListContainer.innerHTML =
                "";

            paginationContainer.innerHTML =
                "";


            const filteredWords =
                getFilteredWords();


            // 沒有資料
            if (
                filteredWords.length === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.style.textAlign =
                    "center";

                empty.style.color =
                    "var(--gray-color)";

                empty.style.padding =
                    "16px";

                empty.style.fontWeight =
                    "500";

                empty.textContent =
                    "沒有符合條件的單字";

                wordListContainer.appendChild(
                    empty
                );

                return;
            }


            const totalPages =
                Math.ceil(
                    filteredWords.length /
                    itemsPerPage
                );


            if (
                currentListPage >
                totalPages
            ) {

                currentListPage =
                    totalPages;
            }


            const start =
                (
                    currentListPage -
                    1
                ) * itemsPerPage;


            const end =
                start + itemsPerPage;


            const currentItems =
                filteredWords.slice(
                    start,
                    end
                );


            // 產生單字
            currentItems.forEach(
                item => {

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "word-item";


                    const current =
                        filteredWords[
                            currentIndex
                        ];


                    const isCurrent =
                        current &&
                        current.word ===
                            item.word &&
                        current.category ===
                            item.category;


                    div.style.backgroundColor =
                        isCurrent
                            ? "var(--current-item-bg)"
                            : "transparent";


                    // 單字按鈕
                    const wordBtn =
                        document.createElement(
                            "button"
                        );

                    wordBtn.className =
                        "word-btn";


                    const strong =
                        document.createElement(
                            "strong"
                        );

                    strong.style.color =
                        "var(--primary-color)";


                    strong.textContent =
                        `[${item.category || "未分類"}]`;


                    wordBtn.appendChild(
                        strong
                    );


                    const text =
                        document.createTextNode(
                            ` ${item.word}：${item.meaning} ${
                                item.known
                                    ? "🟢"
                                    : "🔴"
                            }`
                        );


                    wordBtn.appendChild(
                        text
                    );


                    wordBtn.addEventListener(
                        "click",
                        () => {

                            jumpToWord(
                                item.word,
                                item.category
                            );

                        }
                    );


                    // 刪除按鈕
                    const deleteBtn =
                        document.createElement(
                            "button"
                        );


                    deleteBtn.className =
                        "delete-btn";


                    deleteBtn.textContent =
                        "刪除";


                    deleteBtn.addEventListener(
                        "click",
                        () => {

                            promptDeleteWord(
                                item.word,
                                item.category
                            );

                        }
                    );


                    div.appendChild(
                        wordBtn
                    );

                    div.appendChild(
                        deleteBtn
                    );


                    wordListContainer.appendChild(
                        div
                    );

                }
            );


            // =====================================================
            // 分頁
            // =====================================================

            if (totalPages <= 1) {
                return;
            }


            let pagesToShow = [];

            const maxVisiblePages = 9;


            if (
                totalPages <=
                maxVisiblePages
            ) {

                pagesToShow =
                    Array.from(
                        {
                            length:
                                totalPages
                        },
                        (_, i) =>
                            i + 1
                    );

            } else {

                let startPage =
                    Math.max(
                        1,
                        currentListPage - 4
                    );


                let endPage =
                    Math.min(
                        totalPages,
                        startPage +
                            maxVisiblePages -
                            1
                    );


                if (
                    endPage -
                        startPage +
                        1 <
                    maxVisiblePages
                ) {

                    startPage =
                        Math.max(
                            1,
                            endPage -
                                maxVisiblePages +
                                1
                        );
                }


                if (
                    startPage > 1
                ) {

                    pagesToShow.push(1);

                    if (
                        startPage > 2
                    ) {

                        pagesToShow.push(
                            "..."
                        );
                    }
                }


                for (
                    let i =
                        startPage;
                    i <= endPage;
                    i++
                ) {

                    if (
                        i !== 1 &&
                        i !== totalPages
                    ) {

                        pagesToShow.push(
                            i
                        );
                    }
                }


                if (
                    endPage <
                    totalPages
                ) {

                    if (
                        endPage <
                        totalPages - 1
                    ) {

                        pagesToShow.push(
                            "..."
                        );
                    }

                    pagesToShow.push(
                        totalPages
                    );
                }


                if (
                    !pagesToShow.includes(1)
                ) {

                    pagesToShow.unshift(
                        1
                    );
                }


                if (
                    !pagesToShow.includes(
                        totalPages
                    )
                ) {

                    pagesToShow.push(
                        totalPages
                    );
                }

            }


            pagesToShow.forEach(
                page => {

                    if (
                        page === "..."
                    ) {

                        const ellipsis =
                            document.createElement(
                                "span"
                            );

                        ellipsis.className =
                            "page-ellipsis";

                        ellipsis.textContent =
                            "...";

                        paginationContainer.appendChild(
                            ellipsis
                        );

                        return;
                    }


                    const pageBtn =
                        document.createElement(
                            "button"
                        );


                    pageBtn.className =
                        "page-btn";


                    if (
                        page ===
                        currentListPage
                    ) {

                        pageBtn.classList.add(
                            "active"
                        );
                    }


                    pageBtn.textContent =
                        page;


                    pageBtn.addEventListener(
                        "click",
                        event => {

                            event.preventDefault();

                            changePage(
                                page
                            );

                        }
                    );


                    paginationContainer.appendChild(
                        pageBtn
                    );

                }
            );

        }


        // =========================================================
        // LocalStorage：只保存「熟悉狀態」
        // =========================================================

        function getWordStatusKey(word) {
            if (word?.id) {
                return `id:${word.id}`;
            }

            return `word:${String(word?.word || "").toLowerCase()}\u0000${word?.category || "其他"}`;
        }


        function getKnownStatus(word) {
            const idKey = word?.id ? `id:${word.id}` : null;
            const legacyKey = `word:${String(word?.word || "").toLowerCase()}\u0000${word?.category || "其他"}`;

            if (idKey && Object.prototype.hasOwnProperty.call(knownStatuses, idKey)) {
                return knownStatuses[idKey] === true;
            }

            if (Object.prototype.hasOwnProperty.call(knownStatuses, legacyKey)) {
                return knownStatuses[legacyKey] === true;
            }

            // 舊版遷移時可能使用沒有 word: 前綴的 key。
            const oldKey = `${word?.word || ""}\u0000${word?.category || "其他"}`;
            if (Object.prototype.hasOwnProperty.call(knownStatuses, oldKey)) {
                return knownStatuses[oldKey] === true;
            }

            return false;
        }


        function saveKnownStatuses() {
            try {
                localStorage.setItem(
                    KNOWN_STORAGE_KEY,
                    JSON.stringify(knownStatuses)
                );
            } catch (error) {
                console.error(
                    "熟悉狀態儲存失敗：",
                    error
                );
            }
        }


        function saveKnownStatus(word, status) {
            knownStatuses[getWordStatusKey(word)] = status === true;
            saveKnownStatuses();
        }


        function removeKnownStatus(word) {
            const keys = [
                getWordStatusKey(word),
                `word:${String(word?.word || "").toLowerCase()}\u0000${word?.category || "其他"}`,
                `${word?.word || ""}\u0000${word?.category || "其他"}`
            ];

            keys.forEach(key => {
                delete knownStatuses[key];
            });

            saveKnownStatuses();
        }


        function applyLocalKnownStatuses() {
            words.forEach(word => {
                word.known = getKnownStatus(word);
            });
        }


        // =========================================================
        // 排程雲端同步
        // =========================================================

        function scheduleCloudSave() {

            if (
                isLoadingFromSupabase
            ) {
                return;
            }


            if (!supabaseClient) {

                syncStatus.textContent =
                    "狀態：⚠️ Supabase 未初始化，資料已儲存在本機";

                return;
            }


            clearTimeout(
                saveTimer
            );


            saveTimer =
                setTimeout(
                    () => {

                        saveToSupabase();

                    },
                    800
                );
        }


        // =========================================================
        // 儲存 Supabase
        // =========================================================

        async function saveToSupabase() {

            if (!supabaseClient) {
                syncStatus.textContent =
                    "狀態：⚠️ Supabase 未初始化";
                return;
            }

            if (isLoadingFromSupabase) {
                return;
            }

            try {
                syncStatus.textContent =
                    "狀態：☁️ 正在同步...";

                // 單字本體（word / meaning / example / category）全部存雲端。
                // known 不寫入 Supabase，熟悉狀態只存在本機 LocalStorage。
                for (let i = 0; i < words.length; i++) {
                    const word = words[i];

                    const payload = {
                        word: word.word,
                        meaning: word.meaning,
                        example: word.example || "",
                        category: word.category || "其他"
                    };

                    if (word.id) {
                        const { error } = await supabaseClient
                            .from("vocabulary")
                            .update(payload)
                            .eq("id", word.id);

                        if (error) throw error;
                    } else {
                        const { data, error } = await supabaseClient
                            .from("vocabulary")
                            .insert(payload)
                            .select("id")
                            .single();

                        if (error) throw error;

                        if (data?.id) {
                            words[i].id = data.id;
                        }
                    }
                }

                // 刪除雲端中已經從網頁刪掉的單字。
                const currentIds = new Set(
                    words
                        .map(word => word.id)
                        .filter(Boolean)
                );

                const idsToDelete = [...cloudWordIds].filter(
                    id => !currentIds.has(id)
                );

                if (idsToDelete.length > 0) {
                    const { error } = await supabaseClient
                        .from("vocabulary")
                        .delete()
                        .in("id", idsToDelete);

                    if (error) throw error;
                }

                cloudWordIds = currentIds;

                syncStatus.textContent =
                    `狀態：🟢 雲端同步成功 (${new Date().toLocaleTimeString()})`;

            } catch (error) {
                console.error("Supabase 儲存失敗：", error);
                syncStatus.textContent =
                    "狀態：⚠️ 雲端同步失敗，資料已保留在本機";
            }
        }


        // =========================================================
        // 從 Supabase 讀取
        // =========================================================

        async function loadFromSupabase() {

            if (!supabaseClient) {
                syncStatus.textContent =
                    "狀態：⚠️ Supabase SDK 載入失敗，無法載入雲端單字";
                words = [];
                updateCard();
                return;
            }

            isLoadingFromSupabase = true;

            syncStatus.textContent =
                "狀態：☁️ 正在讀取雲端資料...";

            try {
                const { data, error } = await supabaseClient
                    .from("vocabulary")
                    .select("id, word, meaning, example, category, created_at")
                    .order("created_at", { ascending: true });

                if (error) throw error;

                // 單字本體以雲端為唯一來源。
                words = Array.isArray(data)
                    ? data.map(item => ({
                        id: item.id,
                        word: item.word,
                        meaning: item.meaning,
                        example: item.example || "",
                        category: item.category || "其他",
                        known: false
                    }))
                    : [];

                // 熟悉狀態只從本機 LocalStorage 套用。
                applyLocalKnownStatuses();

                cloudWordIds = new Set(
                    words.map(word => word.id).filter(Boolean)
                );

                currentIndex = 0;
                currentListPage = 1;
                updateCard();

                syncStatus.textContent =
                    `狀態：🟢 已從雲端同步 ${words.length} 個單字；熟悉狀態使用本機儲存 (${new Date().toLocaleTimeString()})`;

            } catch (error) {
                console.error("Supabase 讀取失敗：", error);
                words = [];
                updateCard();
                syncStatus.textContent =
                    "狀態：⚠️ 雲端讀取失敗，沒有使用本機單字資料";

            } finally {
                isLoadingFromSupabase = false;
            }
        }


        // =========================================================
        // 鍵盤操作
        // =========================================================

        document.addEventListener(
            "keydown",
            event => {

                // 如果正在輸入文字，不攔截方向鍵
                const tag =
                    document.activeElement
                        ?.tagName;

                if (
                    tag === "INPUT" ||
                    tag === "SELECT" ||
                    tag === "TEXTAREA"
                ) {
                    return;
                }


                switch (
                    event.key
                ) {

                    case "ArrowLeft":
                        prevCard();
                        break;

                    case "ArrowRight":
                        nextCard();
                        break;

                    case " ":
                        event.preventDefault();
                        flipCard();
                        break;

                    case "1":
                        markStatus(false);
                        break;

                    case "2":
                        markStatus(true);
                        break;

                }

            }
        );


        // =========================================================
        // 啟動
        // =========================================================

        // 啟動時單字本體以雲端為準；LocalStorage 只提供熟悉狀態。
        updateCard();


        // 再嘗試讀取雲端
        loadFromSupabase();

    </script>
